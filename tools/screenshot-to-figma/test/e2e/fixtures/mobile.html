<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
body { width: 390px; height: 844px; background: #FFFFFF; color: #111827; overflow: hidden; }
header { padding: 56px 20px 16px; display: flex; align-items: center; justify-content: space-between; }
h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.avatar { width: 40px; height: 40px; border-radius: 20px; display: block; }
.search { margin: 0 20px; height: 44px; border-radius: 12px; background: #F3F4F6; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #6B7280; font-size: 16px; }
.chips { display: flex; gap: 8px; padding: 16px 20px; }
.chip { padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; background: #F3F4F6; color: #374151; }
.chip.on { background: #111827; color: #FFFFFF; }
.card { margin: 4px 20px 16px; border-radius: 20px; overflow: hidden; background: #FFFFFF; box-shadow: 0 8px 24px rgba(17,24,39,0.12); }
.card canvas { width: 350px; height: 180px; display: block; }
.card .body { padding: 14px 16px 16px; }
.t { font-size: 18px; font-weight: 600; }
.s { font-size: 14px; color: #6B7280; margin-top: 4px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 20px; }
.row canvas { width: 48px; height: 48px; border-radius: 12px; display: block; }
.row .meta { flex: 1; }
.price { font-size: 16px; font-weight: 600; color: #059669; }
.tabbar { position: absolute; left: 0; bottom: 0; width: 390px; height: 84px; border-top: 1px solid #E5E7EB; background: #FFFFFF; display: flex; justify-content: space-around; padding-top: 12px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #9CA3AF; }
.tab.on { color: #4F46E5; }
</style></head><body>
<header><h2>Discover</h2><canvas class="avatar" data-photo="3"></canvas></header>
<div class="search"><svg width="18" height="18" viewBox="0 0 18 18"><circle cx="8" cy="8" r="6" fill="none" stroke="#6B7280" stroke-width="2"/><path d="M12.5 12.5L16 16" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/></svg><span>Search destinations</span></div>
<div class="chips"><div class="chip on"><span>All</span></div><div class="chip"><span>Beaches</span></div><div class="chip"><span>Mountains</span></div><div class="chip"><span>Cities</span></div></div>
<div class="card"><canvas data-photo="11"></canvas><div class="body"><div class="t">Palm Jumeirah Retreat</div><div class="s">Dubai · 4 nights · Beachfront</div></div></div>
<div class="row"><canvas data-photo="21"></canvas><div class="meta"><div class="t">Hatta Mountain Lodge</div><div class="s">2 nights · Hiking</div></div><span class="price">AED 890</span></div>
<div class="row"><canvas data-photo="34"></canvas><div class="meta"><div class="t">Old Town Loft</div><div class="s">3 nights · City centre</div></div><span class="price">AED 1,240</span></div>
<div class="tabbar">
  <div class="tab on"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="#4F46E5"/></svg><span>Home</span></div>
  <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-11a7 7 0 0 1 14 0c0 6.5-7 11-7 11z" fill="none" stroke="#9CA3AF" stroke-width="2"/></svg><span>Saved</span></div>
  <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="#9CA3AF" stroke-width="2"/><path d="M4 10h16" stroke="#9CA3AF" stroke-width="2"/></svg><span>Trips</span></div>
  <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="#9CA3AF" stroke-width="2"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="#9CA3AF" stroke-width="2"/></svg><span>Profile</span></div>
</div>
<script src="photo.js"></script>
</body></html>
